# Published Partition API image. Run on any Docker host, including a Codespace:
#   docker compose -f docker-compose.api.yml up
# Optional auth: UNSTRUCTURED_API_KEY=secret docker compose -f docker-compose.api.yml up
services:
  unstructured-api:
    image: quay.io/unstructured-io/unstructured-api:latest
    container_name: unstructured-api
    ports:
      - "8000:8000"
    environment:
      PORT: "8000"
      HOST: "0.0.0.0"
      WORKERS: "1"
      UNSTRUCTURED_API_KEY: ${UNSTRUCTURED_API_KEY:-}
    restart: unless-stopped
